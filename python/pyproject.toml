[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "gradio>=6.5.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "openai>=2.21.0",
    "pypdf>=6.7.0",
    "python-dotenv>=1.1.1",
    "posthog>=3.0.0",
    # Imported directly by app.py (OpenRouter /rerank); was previously only
    # present as a transitive dependency.
    "requests>=2.32.0",
]

[tool.ruff.lint]
# Selected explicitly so the gate cannot drift with ruff's defaults, which
# broadened in 0.16 and would have turned this job red with no code change.
#
# BLE (blind-except) is deliberately left out: the broad `except Exception`
# blocks in app.py are intentional degradation paths — rerank falls back to
# vector order, retrieval falls back to no context, streaming reports the error
# to the client. Narrowing those would change behaviour in exactly the paths
# written to fail soft.
select = ["E4", "E7", "E9", "F", "I", "UP", "PIE"]
