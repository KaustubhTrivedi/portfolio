name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'

defaults:
  run:
    working-directory: python

env:
  # Pinned so a ruff release cannot change the rule set under CI. Bump
  # deliberately, alongside any fixes the new version requires.
  RUFF_VERSION: '0.16.3'

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # actions/setup-python has no prebuilt CPython for this self-hosted
      # runner's distro (Linux Mint), so it fails before any step can run.
      # uv installs a standalone build instead, independent of the distro.
      - name: Install Python
        run: uv python install 3.12

      - name: Run ruff linter
        run: uvx ruff@${{ env.RUFF_VERSION }} check .

      - name: Run ruff formatter check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

  dependencies:
    name: Dependency Check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv sync --frozen
