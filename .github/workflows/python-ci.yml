name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The self-hosted runner is Linux Mint, which actions/setup-python has
      # no prebuilt Python for; ruff is a standalone binary and needs none.
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ruff
        run: uv tool install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  dependencies:
    name: Dependency Check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # actions/setup-python has no prebuilt Python for the self-hosted Linux
      # Mint runner, so let uv download and manage Python 3.12 itself.
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      # Check uv.lock matches pyproject.toml without installing anything.
      # A full `uv sync` took ~20 minutes and, running alongside the Docker
      # image build on the same self-hosted machine, starved it until the
      # runner dropped its connection.
      - name: Verify lockfile
        run: uv lock --check --python 3.12
