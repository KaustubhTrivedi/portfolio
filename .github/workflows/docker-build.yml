name: Docker Build & Push

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Keep the existing package path so Dokploy continues watching the same image.
  PORTFOLIO_IMAGE_NAME: ${{ github.repository }}/portfolio-nextjs
  PYTHON_IMAGE_NAME: ${{ github.repository }}/portfolio-python

jobs:
  build-portfolio:
    name: Build & Push Static Portfolio Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required portfolio files
        run: |
          test -s portfolio/index.html
          test -s portfolio/chat.html
          test -s portfolio/nginx.conf
          test -s portfolio/Kaustubh_Trivedi_CV.pdf
          test -s portfolio/analytics.js
          test -s portfolio/posthog-config.sh
          # No unfilled design placeholders or dead links may ship.
          ! grep -Eiq 'PLACEHOLDER|\[Title\]|\[dates\]|\[confirm:|href="#"|\{\{' portfolio/index.html
          # The Claude Design runtime must have been compiled out.
          ! grep -Eiq '<x-dc|support\.js|data-dc-script' portfolio/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PORTFOLIO_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build static portfolio image (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          file: ./portfolio/Dockerfile
          load: true
          push: false
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          # Clear a container left behind by an earlier failed run, and always
          # clean up this one, so the self-hosted runner never keeps a stale
          # container holding the name or a port.
          docker rm -f portfolio-smoke 2>/dev/null || true
          trap 'docker rm -f portfolio-smoke >/dev/null 2>&1 || true' EXIT
          # Let Docker pick a free host port instead of assuming 8080 is free.
          docker run -d --name portfolio-smoke -p 127.0.0.1::80 portfolio:ci
          BASE="http://$(docker port portfolio-smoke 80/tcp | head -n1)"
          for i in $(seq 1 20); do
            if curl -fsS "$BASE/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BASE/" | grep -q 'Kaustubh'
          curl -fsS -o /dev/null "$BASE/chat.html"
          curl -fsS -o /dev/null "$BASE/Kaustubh_Trivedi_CV.pdf"
          curl -fsS -o /dev/null "$BASE/portrait.webp"
          curl -fsS -o /dev/null "$BASE/llms.txt"
          curl -fsS -o /dev/null "$BASE/analytics.js"
          # No token in CI, so the entrypoint script must write the "off" config.
          curl -fsS "$BASE/posthog-config.js" | grep -q '__POSTHOG_CONFIG__ = undefined'

      - name: Push static portfolio Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./portfolio
          file: ./portfolio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    name: Build & Push Python Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PYTHON_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Python Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./python
          file: ./python/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
